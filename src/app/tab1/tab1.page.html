<ion-header>
  <ion-toolbar>
    <ion-title>All Movies</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="movies$ | async as movies">
  <ion-list>
    <ion-item
      *ngFor="let movie of movies"
      (click)="toggleFavorite(movie)"
      [color]="isFavorite(movie.uid) ? 'success' : ''"
    >
    <ng-container *ngIf="getTitleInfo(movie) as titleInfo">
      <ion-label>
        <h2>{{ titleInfo.title }}</h2>
  
        <p *ngIf="titleInfo.original">
          <strong>Original:</strong> {{ titleInfo.original }}
        </p>
  
        <p *ngIf="movie.stardateFrom && movie.stardateTo">
          <strong>Stardate:</strong> {{ movie.stardateFrom }} – {{ movie.stardateTo }}
        </p>
  
        <p *ngIf="movie.usReleaseDate">
          <strong>US Release:</strong> {{ movie.usReleaseDate }}
        </p>
      </ion-label>
    </ng-container>
    </ion-item>
  </ion-list>
</ion-content>
